name: Publicar busca no Supabase

# Publica a função "precos" (a busca nas lojas) no projeto do Radar de Preços.
# Roda sozinha quando o código da função muda, ou na aba Actions → "Publicar busca no Supabase" → Run workflow.
# Precisa do segredo SUPABASE_ACCESS_TOKEN (token da conta talleseugenio@gmail.com no Supabase).

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch: {}

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJETO: xgwdrrxbqopsfhjgkvdq
    steps:
      - uses: actions/checkout@v4
      - name: Conferir o token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta o segredo SUPABASE_ACCESS_TOKEN no repositório. Nada foi publicado."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest
      - name: Publicar a função precos
        if: steps.token.outputs.ok == 'true'
        # sem verificação de login: o app chama a função direto, sem chave
        run: supabase functions deploy precos --project-ref "$PROJETO" --no-verify-jwt --use-api
      - name: Testar a busca da Hilux
        if: steps.token.outputs.ok == 'true'
        run: |
          sleep 10
          curl -s -X POST "https://$PROJETO.supabase.co/functions/v1/precos" -H "Content-Type: application/json" \
            -d '{"acao":"buscar","q":"Hilux 2002 a 2005 cabine simples 4x4"}' --max-time 90 \
          | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          print('Filtros entendidos:', (r.get('filtro') or {}).get('partes'))
          print('Anúncios lidos:', r.get('lidas'), '| dentro dos filtros:', r.get('relevantes'), '| falhas:', r.get('falhas'))
          m = r.get('melhor')
          print('Menor preço:', m and (m.get('preco'), m.get('titulo'), m.get('ano'), m.get('km'), m.get('link')))
          assert r.get('filtro'), 'a função publicada não entendeu os filtros'
          "
